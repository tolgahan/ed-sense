name: Release

# A pushed v* tag builds EDSense.exe, signs it (sign.yml) and publishes a
# release for that tag, with the tag's message as its notes. Run it by hand
# to build a tag that already exists. This workflow can sign, so never add
# pull_request_target or workflow_run triggers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.4.0'
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
      exe-sha256: ${{ steps.hash.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: check tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::the tag must look like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: source commit
        id: commit
        # The attestation names github.sha as the source. On a tag push that is
        # the pushed commit, so fail if the tag has moved since. A manual run
        # builds the tag's commit, while its attestation names the commit of
        # the branch it was started from; the summary shows both.
        run: |
          commit="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $commit now, but this run was started for $GITHUB_SHA: the tag was moved"
            exit 1
          fi
          echo "building $TAG = $commit (workflow run for $GITHUB_REF at $GITHUB_SHA)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          {
            echo "### Building $TAG"
            echo ""
            echo "- source commit: \`$commit\`"
            echo "- run started for: \`$GITHUB_REF\` at \`$GITHUB_SHA\`"
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "- manual run: the attestation will name the workflow's commit \`$GITHUB_SHA\` as the source"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          # no module cache from main in a release build
          cache: false
      - name: test
        run: go test ./...
      - name: version resource
        # icon, manifest and version info for the exe; older tags keep their committed .syso
        run: |
          if [ -f assets/winres.json ]; then
            go run github.com/tc-hib/go-winres@v0.3.3 make --in assets/winres.json --out cmd/edsense/rsrc \
              --arch amd64 --product-version "${TAG#v}" --file-version "${TAG#v}"
          fi
      - name: build
        run: |
          mkdir -p dist/EDSense
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H windowsgui -X main.version=${TAG#v}" \
            -o dist/EDSense/EDSense.exe ./cmd/edsense
          cp -r README.md LICENSE docs dist/EDSense/
      - name: hash
        id: hash
        run: |
          sum="$(sha256sum dist/EDSense/EDSense.exe | cut -d' ' -f1)"
          echo "unsigned EDSense.exe sha256 $sum"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: EDSense-unsigned
          path: dist/EDSense/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  sign:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/sign.yml
    with:
      unsigned-artifact-id: ${{ needs.build.outputs.artifact-id }}
      unsigned-sha256: ${{ needs.build.outputs.exe-sha256 }}
      signed-artifact: EDSense-signed
      retention-days: 3
    # empty here; inside sign.yml the certum-signing environment fills them
    secrets:
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # only the checker and the pinned thumbprint, from this workflow's commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/same_build.py
            /.github/workflows/sign.yml
          sparse-checkout-cone-mode: false
      - name: check artifact ids
        # an empty id would make download-artifact fetch every artifact of the run
        env:
          UNSIGNED_ID: ${{ needs.build.outputs.artifact-id }}
          SIGNED_ID: ${{ needs.sign.outputs.signed-artifact-id }}
        run: |
          for id in "$UNSIGNED_ID" "$SIGNED_ID"; do
            if ! [[ "$id" =~ ^[0-9]+$ ]]; then
              echo "::error::missing artifact id: '$id'"
              exit 1
            fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/EDSense
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.signed-artifact-id }}
          path: signed
      - name: check signed exe
        # the signed exe must be the built exe plus a signature and nothing else
        env:
          UNSIGNED_SHA256: ${{ needs.build.outputs.exe-sha256 }}
          SIGNED_SHA256: ${{ needs.sign.outputs.signed-sha256 }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          echo "releasing $TAG, built from $COMMIT"
          # a job output that went missing arrives as '' without any error
          if [ -z "$UNSIGNED_SHA256" ] || [ -z "$SIGNED_SHA256" ]; then
            echo "::error::the build or sign job did not pass on the exe hash"
            exit 1
          fi
          cert_sha1="$(sed -n 's/^  CERT_SHA1: \([0-9A-F]\{40\}\)$/\1/p' .github/workflows/sign.yml)"
          if [ "${#cert_sha1}" -ne 40 ]; then
            echo "::error::no CERT_SHA1 line in sign.yml"
            exit 1
          fi
          python3 .github/scripts/same_build.py dist/EDSense/EDSense.exe signed/EDSense.exe \
            --unsigned-sha256 "$UNSIGNED_SHA256" --signed-sha256 "$SIGNED_SHA256" \
            --signer-sha1 "$cert_sha1" --require-timestamp
          cp signed/EDSense.exe dist/EDSense/EDSense.exe
      - name: package
        working-directory: dist
        run: |
          zip -r "EDSense-${TAG}-windows-amd64.zip" EDSense
          sha256sum "EDSense-${TAG}-windows-amd64.zip" EDSense/EDSense.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/EDSense/EDSense.exe
            dist/EDSense-${{ env.TAG }}-windows-amd64.zip
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # the notes: an annotated tag's message when it says more than the
            # tag name, else GitHub's list of changes
            notes=(--generate-notes)
            sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha')"
            if [ -n "$sha" ]; then
              msg="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message)"
              if [ -n "$(printf '%s\n' "$msg" | grep -vx -e "$TAG" -e '')" ]; then
                # from the API: this checkout has no tags, so gh's
                # --notes-from-tag cannot read it
                printf '%s\n' "$msg" > "$RUNNER_TEMP/notes.md"
                notes=(--notes-file "$RUNNER_TEMP/notes.md")
              fi
            fi
            gh release create "$TAG" --draft --verify-tag --title "$TAG" "${notes[@]}"
          fi
          gh release upload "$TAG" --clobber "dist/EDSense-${TAG}-windows-amd64.zip" dist/SHA256SUMS.txt
          # publish once the files are there; a rebuild of a published
          # release only replaces its files
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            if [[ "$TAG" == *-* ]]; then
              gh release edit "$TAG" --draft=false --prerelease
            else
              gh release edit "$TAG" --draft=false --latest
            fi
            echo "published $TAG"
          fi
