name: Release

# A pushed v* tag builds EDSense.exe and attaches it to a draft release for
# that tag. Run it by hand to build a tag that already exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.4.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: test
        run: go test ./...
      - name: build
        run: |
          mkdir -p dist/EDSense
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${TAG#v}" \
            -o dist/EDSense/EDSense.exe ./cmd/edsense
          cp README.md LICENSE dist/EDSense/
      - name: package
        working-directory: dist
        run: |
          zip -r "EDSense-${TAG}-windows-amd64.zip" EDSense
          sha256sum "EDSense-${TAG}-windows-amd64.zip" EDSense/EDSense.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/EDSense/EDSense.exe
            dist/EDSense-${{ env.TAG }}-windows-amd64.zip
      - name: upload
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber "dist/EDSense-${TAG}-windows-amd64.zip" dist/SHA256SUMS.txt
