name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: test
        run: go test ./...
      - name: race
        # the gyro is fed on the controller's reading goroutine and set from the app's;
        # the engine switches the backend under the running loop, and the Store is
        # written by the tray and the window while the loop reads it
        run: |
          go test -race ./internal/gyro/...
          go test -race ./internal/app ./internal/engine ./internal/config
      - name: web
        # the window's page: ES modules, parsed as such
        run: |
          for f in internal/ui/web/js/*.js; do
            node --input-type=module --check < "$f" || { echo "$f"; exit 1; }
          done
      - name: build
        # production: no DevTools and no dev server in the window
        run: GOOS=windows GOARCH=amd64 go build -tags production -trimpath -o /dev/null ./cmd/edsense
