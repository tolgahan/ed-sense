name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: test
        run: go test ./...
      - name: race
        # the gyro is fed on the controller's reading goroutine and set from the app's
        run: go test -race ./internal/gyro/...
      - name: build
        run: GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/edsense
