<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
<meta name="color-scheme" content="light dark">
<title>EDSense</title>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div class="resize-top" aria-hidden="true"></div>
<div class="shell">

<nav class="side" aria-label="EDSense">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="10" rx="5"/><path d="M7.5 10v4M5.5 12h4"/><circle cx="15.5" cy="11" r="0.9"/><circle cx="17.8" cy="13.2" r="0.9"/></svg>
    </span>
    <span class="brand-name">EDSense</span>
  </div>
  <div class="side-body">
    <button class="nav search" type="button" disabled aria-label="Search settings, comes in a later step">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      <span class="label grow">Search settings</span>
      <span class="kbd" aria-hidden="true">Ctrl+K</span>
    </button>

    <button class="nav" type="button" data-page="home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/></svg>
      <span class="label">Home</span>
    </button>
    <button class="nav" type="button" data-page="controller">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="10" rx="5"/><path d="M7.5 10v4M5.5 12h4"/><circle cx="15.5" cy="11" r="0.6"/><circle cx="17.8" cy="13.2" r="0.6"/></svg>
      <span class="label">Controller</span>
    </button>
    <button class="nav" type="button" data-page="feel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 10c2.2-3 4.3-3 6.4 0s4.3 3 6.4 0 4.3-3 6.2 0"/><path d="M2.5 16c2.2-3 4.3-3 6.4 0s4.3 3 6.4 0 4.3-3 6.2 0"/></svg>
      <span class="label">Feel</span>
    </button>
    <button class="nav" type="button" data-page="triggers">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h5.5a5 5 0 0 1 5 5V11H7z"/><path d="M7 11v9.5"/><path d="M11 15h2"/></svg>
      <span class="label">Triggers</span>
    </button>
    <button class="nav" type="button" data-page="lights">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <span class="label">Lights</span>
    </button>
    <button class="nav" type="button" data-page="gyro">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="1.2"/></svg>
      <span class="label">Gyro aim</span>
    </button>
    <button class="nav" type="button" data-page="hud">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 17.5a8 8 0 1 1 16 0"/><path d="M12 17.5 15.5 12"/></svg>
      <span class="label">HUD reader</span>
    </button>
    <div class="grow"></div>
    <button class="nav" type="button" data-page="advanced">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h12M20 17h0"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
      <span class="label">Advanced</span>
    </button>
    <button class="nav" type="button" data-page="about">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></svg>
      <span class="label">About</span>
    </button>
    <div class="side-foot">
      <span class="dot" id="foot-dot" aria-hidden="true"></span>
      <span class="foot-text" id="foot-text">Starting</span>
      <button class="btn quiet small" type="button" id="foot-pause" aria-describedby="foot-text" disabled><span class="label">Pause</span></button>
    </div>
  </div>
</nav>

<div class="column">
  <div class="titlebar">
    <div class="caption-buttons">
      <button class="cap" type="button" id="cap-min" tabindex="-1" aria-label="Minimize" title="Minimize"><span class="cap-glyph min" aria-hidden="true"></span></button>
      <button class="cap" type="button" id="cap-max" tabindex="-1" aria-label="Maximize" title="Maximize"><span class="cap-glyph max" aria-hidden="true"></span></button>
      <button class="cap close" type="button" id="cap-close" tabindex="-1" aria-label="Close" title="Close"><span class="cap-glyph close" aria-hidden="true"></span></button>
    </div>
  </div>
  <main class="main" id="main">
    <div class="page">
      <p class="muted" id="loading">Starting</p>
    </div>
  </main>
</div>

</div>
<div class="toasts" id="toasts"></div>
<div class="sr-only" id="say" role="status" aria-atomic="false"></div>
<div class="sr-only" id="alarm" role="alert" aria-atomic="false"></div>
</body>
</html>
